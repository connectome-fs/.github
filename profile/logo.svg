    <circle cx="128" cy="56" r="14"/>
    <circle cx="192" cy="100" r="14"/>
    <circle cx="84" cy="156" r="12"/>
    <circle cx="172" cy="164" r="12"/>
    <circle cx="128" cy="200" r="15"/>
