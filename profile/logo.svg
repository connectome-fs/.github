<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="connectome-fs">
  <title>connectome-fs</title>
  <defs>
    <linearGradient id="field" x1="40" y1="36" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12353a"/>
      <stop offset="100%" stop-color="#0a1c22"/>
    </linearGradient>
  </defs>
  <!-- Dark field — not a DevCentr teal tile -->
  <rect width="256" height="256" rx="52" fill="url(#field)"/>
  <!--
    Brain outline (side-ish / top silhouette) drawn as a connectome:
    teal axons + pink synapses along the cortex ridge.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- cortical ridge + cerebellum lobe -->
    <path
      stroke="#3ec9c4"
      stroke-width="3.2"
      d="M78 148
         C72 118 86 78 118 64
         C138 54 158 58 172 72
         C188 58 208 66 214 88
         C222 108 216 128 204 142
         C214 152 216 168 206 180
         C194 196 168 204 148 198
         C132 210 108 206 96 186
         C86 172 82 160 78 148 Z"
      opacity="0.22"
    />
    <!-- primary axon mesh following the outline -->
    <path
      stroke="#3ec9c4"
      stroke-width="2.4"
      d="M96 150 L108 118 L124 92 L148 78 L172 86 L190 78 L206 96 L208 122 L196 144 L204 164 L188 182 L160 190 L136 186 L112 176 L100 158"
    />
    <path
      stroke="#f078a8"
      stroke-width="2.2"
      d="M124 92 L142 108 L160 100 L178 112 L190 132 L176 150 L158 142 L140 156 L122 140 L132 122"
    />
    <path
      stroke="#3ec9c4"
      stroke-width="1.8"
      opacity="0.85"
      d="M148 78 L158 142 M172 86 L176 150 M108 118 L122 140 M196 144 L176 150 M136 186 L140 156"
    />
    <path
      stroke="#f078a8"
      stroke-width="1.7"
      opacity="0.9"
      d="M190 78 L178 112 M206 96 L190 132 M188 182 L176 150 M112 176 L122 140"
    />
  </g>
  <!-- Neurons: teal cortex, pink association hubs -->
  <g>
    <circle cx="108" cy="118" r="5.5" fill="#3ec9c4"/>
    <circle cx="124" cy="92" r="6" fill="#3ec9c4"/>
    <circle cx="148" cy="78" r="6.5" fill="#f078a8"/>
    <circle cx="172" cy="86" r="5.5" fill="#3ec9c4"/>
    <circle cx="190" cy="78" r="5" fill="#f078a8"/>
    <circle cx="206" cy="96" r="5.5" fill="#3ec9c4"/>
    <circle cx="208" cy="122" r="5" fill="#3ec9c4"/>
    <circle cx="196" cy="144" r="5.5" fill="#f078a8"/>
    <circle cx="204" cy="164" r="4.5" fill="#3ec9c4"/>
    <circle cx="188" cy="182" r="5.5" fill="#3ec9c4"/>
    <circle cx="160" cy="190" r="6" fill="#f078a8"/>
    <circle cx="136" cy="186" r="5" fill="#3ec9c4"/>
    <circle cx="112" cy="176" r="5" fill="#3ec9c4"/>
    <circle cx="100" cy="158" r="5" fill="#f078a8"/>
    <circle cx="96" cy="150" r="4.5" fill="#3ec9c4"/>
    <!-- interior association cortex -->
    <circle cx="142" cy="108" r="4.5" fill="#f078a8"/>
    <circle cx="160" cy="100" r="4" fill="#3ec9c4"/>
    <circle cx="178" cy="112" r="4.5" fill="#f078a8"/>
    <circle cx="190" cy="132" r="4" fill="#3ec9c4"/>
    <circle cx="176" cy="150" r="5.5" fill="#f078a8"/>
    <circle cx="158" cy="142" r="4" fill="#3ec9c4"/>
    <circle cx="140" cy="156" r="4.5" fill="#f078a8"/>
    <circle cx="122" cy="140" r="5" fill="#3ec9c4"/>
    <circle cx="132" cy="122" r="4" fill="#f078a8"/>
  </g>
</svg>
